<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Complete Your Profile - Nagar Alert Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        
        /* Light Mode Optimizations */
        body.a11y-light-mode .bg-slate-900\/50,
        body.a11y-light-mode .bg-slate-900 {
            background-color: #ffffff !important;
            border-color: #e2e8f0 !important;
            color: #0f172a !important;
        }
        body.a11y-light-mode .bg-slate-800\/80 {
            background-color: #f1f5f9 !important;
            color: #475569 !important;
        }
        body.a11y-light-mode .border-slate-700 { border-color: #e2e8f0 !important; }
        body.a11y-light-mode .text-slate-300 { color: #334155 !important; }
        body.a11y-light-mode .text-slate-400 { color: #64748b !important; }
        body.a11y-light-mode .text-slate-500 { color: #94a3b8 !important; }
        body.a11y-light-mode main .text-white,
        body.a11y-light-mode #qrPanel .text-white { color: #0f172a !important; }
        
        body.a11y-light-mode .bg-blue-900\/30 { background-color: #eff6ff !important; }
        body.a11y-light-mode .border-blue-500\/30 { border-color: #bfdbfe !important; }
        body.a11y-light-mode .text-blue-400 { color: #2563eb !important; }

        body.a11y-light-mode .bg-emerald-900\/30 { background-color: #ecfdf5 !important; }
        body.a11y-light-mode .border-emerald-500\/30 { border-color: #a7f3d0 !important; }
        body.a11y-light-mode .text-emerald-400 { color: #10b981 !important; }

        body.a11y-light-mode input.bg-slate-900 {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }
        body.a11y-light-mode .hover\:bg-slate-800\/50:hover {
            background-color: #f1f5f9 !important;
        }
    </style>
    <th:block th:replace="~{accessibility :: accessibility-styles}"></th:block>
</head>

<body class="bg-slate-950 flex flex-col text-white min-h-screen relative">
    <header class="sticky top-0 w-full z-50">
        <th:block th:replace="~{accessibility :: accessibility-top-bar}"></th:block>
    </header>
    <main class="flex-grow flex flex-col items-center justify-center p-4 w-full relative">

    <!-- Logo header -->
    <div class="mb-8 flex items-center space-x-2">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-sm">
            <span class="text-sm">📢</span>
        </div>
        <h1 class="text-xl font-bold text-white tracking-tight">Nagar Alert Hub</h1>
    </div>

    <div class="w-full max-w-md p-6 sm:p-8 md:p-10 bg-slate-900/50 border border-slate-700 rounded-[1.5rem] shadow-xl backdrop-blur-sm relative text-center">

        <div class="w-14 h-14 sm:w-16 sm:h-16 bg-blue-900/30 rounded-2xl flex items-center justify-center mx-auto mb-4 sm:mb-6 border border-blue-500/30">
            <span class="text-2xl sm:text-3xl">👋</span>
        </div>

        <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight mb-2">Almost Done!</h1>
        <p class="text-slate-400 mb-6 sm:mb-8 text-xs sm:text-sm leading-relaxed">
            Welcome, <span class="text-blue-400 font-bold" th:text="${name}">User</span>! <br>
            Please provide your WhatsApp mobile number so you can track your reported alerts.
        </p>

        <form th:action="@{/submit-phone}" method="post" class="space-y-4 sm:space-y-6">
            <div class="text-left">
                <label class="block text-[10px] sm:text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">WhatsApp Mobile Number</label>
                <div class="flex">
                    <span class="inline-flex items-center px-3 sm:px-4 rounded-l-xl bg-slate-800/80 border border-r-0 border-slate-700 text-slate-300 font-semibold text-sm">+91</span>
                    <input type="tel" name="mobileNumber" required pattern="[0-9]{10}"
                        class="w-full bg-slate-900 border border-slate-700 rounded-r-xl p-3 sm:p-3.5 text-white focus:border-blue-500 focus:ring-2 focus:ring-blue-900/50 focus:outline-none placeholder-slate-500 transition text-sm sm:text-base"
                        placeholder="e.g. 9876543210">
                </div>
                <p class="text-[9px] sm:text-[10px] text-slate-500 mt-2 font-medium flex items-center">
                    <span class="mr-1 mt-0.5">ℹ️</span> Required for receiving webhook updates via Twilio.
                </p>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 sm:py-3.5 rounded-xl shadow-sm transition mt-2 active:scale-[0.98] text-sm sm:text-base">
                Save & Continue
            </button>
        </form>
        
        <div class="mt-8">
            <a href="/logout" class="text-xs text-slate-500 hover:text-red-400 transition font-medium border-b border-transparent hover:border-red-500/30 pb-0.5">Cancel & Logout</a>
        </div>
    </div>
    </main>
    
    <!-- Twilio QR Side Handle (Chrome Style) -->
    <div id="qrPanel" class="fixed right-0 top-1/2 -translate-y-1/2 z-50 flex items-center transition-transform duration-500 ease-[cubic-bezier(0.19,1,0.22,1)] transform translate-x-0">
        
        <div class="bg-slate-900 border-y border-l border-slate-700 rounded-l-[1.5rem] shadow-2xl flex items-center p-6 relative w-[18rem] min-h-[14rem] cursor-default">
            
            <!-- Handle View (Visible only when collapsed) -->
            <div id="qrHandle" onclick="toggleQRPanel()" class="absolute left-0 top-0 bottom-0 w-16 flex items-center justify-center transition-opacity duration-300 opacity-0 pointer-events-none cursor-pointer hover:bg-slate-800/50 rounded-l-[1.5rem]">
                <div class="flex items-center space-x-1">
                    <svg class="w-5 h-5 text-blue-500" fill="currentColor" viewBox="0 0 24 24"><path d="M17 2H7c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 18H7V4h10v16z"/><path d="M10 17h4v2h-4z"/></svg>
                    <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </div>
            </div>

            <!-- Expanded Content -->
            <div id="qrContent" class="transition-opacity duration-300 w-full pl-6 flex items-center delay-100 opacity-100">
                <a href="https://wa.me/14155238886?text=join%20fair-real" target="_blank" class="shrink-0 block p-1.5 bg-white rounded-xl shadow-sm border border-slate-700 hover:border-blue-500 hover:shadow-md transition">
                    <img src="/images/twilio_qr.png" alt="Twilio WhatsApp QR Code" class="w-[84px] h-[84px] rounded-lg">
                </a>
                <div class="ml-4 flex-1">
                    <div class="inline-flex items-center px-1.5 py-0.5 rounded text-[9px] font-bold uppercase tracking-widest text-emerald-400 bg-emerald-900/30 border border-emerald-500/30 mb-1.5">
                        <span class="mr-1 w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Sandbox
                    </div>
                    <div>
                        <p class="text-[13px] text-white font-medium tracking-tight">Activate WhatsApp <br>Sandbox</p>
                        <p class="text-[11px] text-slate-400 mt-1">Scan for notifications</p>
                    </div>
                </div>
                
                <!-- Right Chevron (Visible on Expanded) -->
                <div onclick="toggleQRPanel()" class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer hover:bg-slate-800/50 p-2 rounded-full transition-colors">
                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </div>
            </div>
            
        </div>
    </div>
    
    <script>
        function toggleQRPanel() {
            const panel = document.getElementById('qrPanel');
            const handle = document.getElementById('qrHandle');
            const content = document.getElementById('qrContent');
            
            if (panel.classList.contains('translate-x-0')) {
                // Collapse
                panel.classList.remove('translate-x-0');
                panel.classList.add('translate-x-[calc(100%-4rem)]');
                content.classList.remove('opacity-100', 'delay-100');
                content.classList.add('opacity-0', 'pointer-events-none');
                handle.classList.remove('opacity-0', 'pointer-events-none');
                handle.classList.add('opacity-100');
            } else {
                // Expand
                panel.classList.remove('translate-x-[calc(100%-4rem)]');
                panel.classList.add('translate-x-0');
                handle.classList.remove('opacity-100');
                handle.classList.add('opacity-0', 'pointer-events-none');
                content.classList.remove('opacity-0', 'pointer-events-none');
                content.classList.add('opacity-100', 'delay-100');
            }
        }
    </script>
    
    <th:block th:replace="~{accessibility :: accessibility-widget}"></th:block>
</body>
</html>

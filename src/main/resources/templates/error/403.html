<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Nagar Alert Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: 
                linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)),
                url('data:image/svg+xml;utf8,<svg width="40" height="40" xmlns="http://www.w3.org/2000/svg"><path d="M0 0h40v40H0z" fill="none"/><path d="M0 19.5h40v1H0zM19.5 0v40h1V0z" fill="rgba(255,255,255,0.05)"/></svg>');
        }
        .arcade-text {
            font-family: 'Press Start 2P', cursive;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800/80 p-8 rounded-2xl border border-red-500/30 shadow-2xl shadow-red-900/20 text-center backdrop-blur-sm">
        
        <div class="w-20 h-20 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
        </div>

        <h1 class="arcade-text text-xl text-red-400 mb-4">ACCESS DENIED</h1>
        
        <p class="text-slate-300 mb-8 leading-relaxed">
            Citizens do not have permission to access the Administrator Portal. 
            If you are an administrator, please log out and log back in using your admin credentials.
        </p>

        <div class="flex flex-col space-y-3">
            <a href="/" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-lg shadow-blue-900/50">
                Return to Home
            </a>
            
            <form action="/logout" method="post">
                <button type="submit" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-xl transition duration-200 border border-slate-600">
                    Log Out
                </button>
            </form>
        </div>

    </div>

</body>
</html>

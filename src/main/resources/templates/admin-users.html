<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>User Management - Nagar Alert Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .glass { background: rgba(30,41,59,0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
    <th:block th:replace="~{accessibility :: accessibility-styles}"></th:block>
    <th:block th:replace="~{components :: siteStyles}"></th:block>
</head>

<body class="bg-slate-950 text-white min-h-screen flex flex-col">
    <th:block th:replace="~{components :: siteBackground}"></th:block>
    <th:block th:replace="~{components :: adminTopBar(deptName=${deptName})}"></th:block>

    <div class="flex flex-1">
        <th:block th:replace="~{components :: adminSidebar(activeTab=${activeTab}, deptName=${deptName})}"></th:block>

        <main class="flex-1">
            <div class="px-4 sm:px-6 py-6 max-w-7xl mx-auto">
                <div class="mb-6">
                    <h2 class="text-xl md:text-2xl font-bold text-white">User Management</h2>
                    <p class="text-slate-500 text-sm mt-1">OAuth2 synced citizen profiles from MongoDB</p>
                </div>

                <div th:if="${users.empty}" class="glass p-16 rounded-2xl text-center border-dashed border-2 border-slate-700">
                    <div class="text-5xl mb-4 opacity-40">👥</div>
                    <p class="text-slate-400">No registered users yet.</p>
                </div>

                <div th:unless="${users.empty}" class="glass rounded-2xl border border-slate-700 overflow-hidden">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="bg-slate-800/80 text-xs uppercase text-slate-400 border-b border-slate-700 font-semibold">
                            <tr>
                                <th class="px-5 py-4">User</th>
                                <th class="px-5 py-4">Email</th>
                                <th class="px-5 py-4">Provider</th>
                                <th class="px-5 py-4">Phone</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700/50">
                            <tr th:each="user : ${users}" class="hover:bg-slate-800/40 transition">
                                <td class="px-5 py-4">
                                    <div class="flex items-center gap-3">
                                        <img th:if="${user.profileImage != null}" th:src="${user.profileImage}"
                                             class="w-9 h-9 rounded-full border border-slate-600 object-cover" alt="Avatar">
                                        <div th:unless="${user.profileImage != null}"
                                             class="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center border border-slate-600">👤</div>
                                        <span class="text-white font-medium" th:text="${user.name}">Name</span>
                                    </div>
                                </td>
                                <td class="px-5 py-4 text-xs" th:text="${user.email}">email</td>
                                <td class="px-5 py-4">
                                    <span class="px-2 py-1 rounded text-[10px] font-bold bg-blue-900/30 text-blue-400 border border-blue-500/30" th:text="${user.oauthProvider}">GOOGLE</span>
                                </td>
                                <td class="px-5 py-4 text-xs font-mono" th:text="${user.mobileNumber != null ? user.mobileNumber : '—'}">—</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <th:block th:replace="~{accessibility :: accessibility-widget}"></th:block>
</body>
</html>

spring.application.name=NagarAlertHub

# MongoDB Configuration
# Using local MongoDB instance
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=nagaralertdb

# Groq API Key for Department Classifier
groq.api.key=demo_key

# File Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Twilio WhatsApp Configuration
# Replace these with your actual Twilio Account credentials
twilio.account.sid=test_sid
twilio.auth.token=test_token
twilio.whatsapp.from=test_from

# OAuth2 Provider Credentials
# Replace these values in Railway Environment Variables for Production
spring.security.oauth2.client.registration.google.client-id=demo_id
spring.security.oauth2.client.registration.google.client-secret=demo_secret

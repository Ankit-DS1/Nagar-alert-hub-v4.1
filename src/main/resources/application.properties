spring.application.name=NagarAlertHub

# MongoDB Configuration
# Replace this with your actual MongoDB Atlas Connection String or use local
spring.data.mongodb.uri=YOUR_MONGODB_URL
spring.data.mongodb.database=nagaralertdb

# Groq API Key for Department Classifier
groq.api.key=YOUR_GROQ_API_KEY_HERE

# File Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Twilio WhatsApp Configuration
# Replace these with your actual Twilio Account credentials
twilio.account.sid=YOUR_TWILIO_SID_HERE
twilio.auth.token=YOUR_TWILIO_AUTH_TOKEN_HERE
twilio.whatsapp.from=YOUR_TWILIO_WHATSAPP_FROM

# OAuth2 Provider Credentials
# Replace these values in Railway Environment Variables for Production
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_SECRET

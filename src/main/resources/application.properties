spring.application.name=NagarAlertHub

# MongoDB Configuration
# Set MONGODB_URI as an environment variable — never hardcode credentials
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=nagaralertdb

# Groq API Key for Department Classifier
# Set GROQ_API_KEY as an environment variable
groq.api.key=${GROQ_API_KEY:your_groq_api_key_here}

# File Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Twilio WhatsApp Configuration
# Set these as environment variables for production
twilio.account.sid=${TWILIO_ACCOUNT_SID:test_sid}
twilio.auth.token=${TWILIO_AUTH_TOKEN:test_token}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:test_from}

# OAuth2 Provider Credentials
# Set these as environment variables in Railway / production
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:demo_id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:demo_secret}
